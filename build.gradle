plugins {
    id 'java'
    id 'com.cleanroommc.cleanroomgradle'
    id 'com.cleanroommc.conventions' version '1.4.0'
}

group = root_package

base {
    archivesName = mod_id
}

def accessTransformerNames = access_transformers.tokenize()

conventions {
    if (mod_authors) {
        author = mod_authors
    }
    mods {
        if (curseforge_project_id) {
            curseforge {
                projectId = curseforge_project_id
            }
        }
        if (modrinth_project_id) {
            modrinth {
                projectId = modrinth_project_id
            }
        }
    }
}

dependencies {
    implementation cleanroom.userdev(cleanroom_version) {
        accessTransformers.from(accessTransformerNames.collect { "src/main/resources/META-INF/$it" })
    }
}

cleanroom {
    runs {
        client {
            configure {
                username = minecraft_username
                jvmArgs '-Dcrl.dev.mixin=mixins.chad_heads_cre.json'
                jvmArgs extra_jvm_args.tokenize()
            }
        }
        server {
            configure {
                jvmArgs '-Dcrl.dev.mixin=mixins.chad_heads_cre.json'
                jvmArgs extra_jvm_args.tokenize()
            }
        }
    }
}

tokenEnvoy {
    set 'MOD_VERSION', project.version
    set 'MOD_AUTHORS', mod_authors.tokenize(',')*.trim().join('", "')
    set file('tokens.properties')
}

jar {
    from('LICENSE.md')
    manifest {
        attributes 'MixinConfigs': 'mixins.chad_heads_cre.json'
        if (accessTransformerNames) {
            attributes 'FMLAT': accessTransformerNames.join(' ')
        }
        if (coremod_plugin_class) {
            attributes 'FMLCorePlugin': coremod_plugin_class
            if (coremod_includes_mod.toBoolean()) {
                attributes 'FMLCorePluginContainsFMLMod': true, 'ForceLoadAsMod': true
            }
        }
    }
}

tasks.withType(Checkstyle).configureEach {
    enabled = enable_checkstyle.toBoolean()
}

tasks.matching { it.name in ['clearSkiesCheck', 'formatJavaCheck'] }.configureEach {
    enabled = enable_formatting.toBoolean()
}

// TODO: fundamental Foundation issue
tasks.withType(JavaExec).configureEach {
    systemProperty 'foundation.loadsall', 'true'
}

// Preserve the project's MPL license in published Maven metadata.
publishing {
    publications.withType(MavenPublication).configureEach {
        pom.licenses {
            license {
                name = 'Mozilla Public License 2.0'
                url = 'https://www.mozilla.org/MPL/2.0/'
            }
        }
    }
}

// GitHub Releases receive the distributable jars, without the MCP development jar.
def releaseArtifacts = tasks.register('stageReleaseArtifacts', Sync) {
    from(tasks.named('reobfJar'))
    from(tasks.named('sourcesJar'))
    from(tasks.named('javadocJar'))
    into(layout.buildDirectory.dir('release'))
}
tasks.named('build') {
    dependsOn(releaseArtifacts)
}
