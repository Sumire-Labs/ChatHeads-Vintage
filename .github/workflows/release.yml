name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:

permissions:
  contents: write
  issues: read
  pull-requests: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: |-
            8
            25
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Build
        run: ./gradlew build
      - name: Generate release notes
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          config: cliff.toml
          args: --latest --strip all
        env:
          OUTPUT: ${{ runner.temp }}/RELEASE_NOTES.md
          GITHUB_REPO: ${{ github.repository }}
      - name: Publish mods
        if: github.ref_type == 'tag'
        env:
          CHANGELOG_FILE: ${{ runner.temp }}/RELEASE_NOTES.md
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: ./gradlew publishMods --no-configuration-cache
      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/RELEASE_NOTES.md" build/release/*.jar

      - name: Generate changelog
        if: github.ref_type == 'tag'
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          config: cliff.toml
        env:
          OUTPUT: ${{ runner.temp }}/CHANGELOG.md
          CLIFF_INCLUDE_DATE: '1'
          GITHUB_REPO: ${{ github.repository }}
      - name: Update changelog
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          gh auth setup-git
          git fetch origin "$BRANCH"
          if ! git merge-base --is-ancestor HEAD FETCH_HEAD; then
            exit 0
          fi
          git switch --detach FETCH_HEAD
          cp "$RUNNER_TEMP/CHANGELOG.md" CHANGELOG.md
          if git diff --quiet -- CHANGELOG.md; then
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "docs: update changelog" -- CHANGELOG.md
          git push origin "HEAD:refs/heads/$BRANCH"
